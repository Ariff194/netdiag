[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netdiag"
version = "0.1.0"
description = "Layer-by-layer network connectivity diagnosis"
requires-python = ">=3.10"

[project.scripts]
netdiag = "netdiag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]